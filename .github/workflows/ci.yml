name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: TypeScript, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install root dependencies
        run: npm ci

      - name: Install mobile dependencies for shared logic tests
        run: npm --prefix mobile ci

      - name: Install isolated infrastructure validation tools
        run: |
          python3 -m venv web/.runtime/infra-checks
          web/.runtime/infra-checks/bin/python -m pip install -r infra/requirements-checks.txt

      - name: Validate both infrastructure identity modes offline
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_DEFAULT_REGION: us-east-2
        run: |
          web/.runtime/infra-checks/bin/cfn-lint --template infra/template.yaml --regions us-east-2
          web/.runtime/infra-checks/bin/python -m unittest discover -s infra/tests -v

      - name: Check shared packages, backend and mobile logic
        run: npm run check

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Check web TypeScript
        run: npm --prefix web run typecheck

      - name: Build website
        run: npm --prefix web run build

      - name: Install test browser
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium

      - name: Test authentication, comparison and original web workflows
        run: npm --prefix web test
