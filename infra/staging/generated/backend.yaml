          - Action: bedrock:InvokeModel
            Effect: Allow
            Resource:
            - Fn::Sub: arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}
            - Fn::Sub: arn:aws:bedrock:*::foundation-model/${BedrockFoundationModel}
          - Action:
            - s3:GetObject
            - s3:DeleteObject
            Effect: Allow
            Resource:
              Fn::Sub: ${UploadBucket.Arn}/uploads/*
          - Action:
            - transcribe:GetTranscriptionJob
            - transcribe:DeleteTranscriptionJob
            Effect: Allow
            Resource:
              Fn::Sub: arn:${AWS::Partition}:transcribe:${AWS::Region}:${AWS::AccountId}:transcription-job/actionbridge-${AWS::StackName}_*
          - Action:
            - transcribe:StartTranscriptionJob
            - textract:DetectDocumentText
            - textract:StartDocumentTextDetection
            - textract:GetDocumentTextDetection
