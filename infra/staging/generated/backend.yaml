      FunctionName: actionbridge-dental-staging-job-worker
      Handler: index.handler
      MemorySize: 1024
      Role:
        Fn::GetAtt:
        - JobWorkerFunctionRole
        - Arn
      Runtime: nodejs22.x
      Tags:
      - Key: lambda:createdBy
        Value: SAM
      Timeout: 240
    Type: AWS::Lambda::Function
  JobWorkerFunctionJobs:
    DependsOn:
    - JobWorkerLogGroup
    Properties:
      BatchSize: 1
      EventSourceArn:
        Fn::GetAtt:
        - JobQueue
        - Arn
      FunctionName:
        Ref: JobWorkerFunction
      FunctionResponseTypes:
      - ReportBatchItemFailures
      ScalingConfig:
        MaximumConcurrency: 2
    Type: AWS::Lambda::EventSourceMapping
  JobWorkerFunctionRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action:
          - sts:AssumeRole
          Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole
      Path: /actionbridge/staging/actionbridge-dental-staging/
      PermissionsBoundary: arn:aws:iam::631367363628:policy/actionbridge-dental-staging-job-worker-boundary
      Policies:
      - PolicyDocument:
          Statement:
          - Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            Effect: Allow
            Resource:
              Fn::GetAtt:
              - CasesTable
