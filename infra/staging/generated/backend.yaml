    Type: AWS::Lambda::Permission
  JobsFunctionRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action:
          - sts:AssumeRole
          Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Path: /actionbridge/staging/actionbridge-dental-staging/
      PermissionsBoundary: arn:aws:iam::631367363628:policy/actionbridge-dental-staging-jobs-boundary
      Policies:
      - PolicyDocument:
          Statement:
          - Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            Effect: Allow
