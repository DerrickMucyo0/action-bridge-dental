        S3Key:
          Ref: JobWorkerArtifactKey
      Description: "Agent worker \u2014 bounded Bedrock tool loop over the deterministic engine (SQS, batch 1)"
      Environment:
        Variables:
          APP_ENV:
            Ref: AppEnv
          AUTH_MODE: jwt
          BEDROCK_MODEL_ID:
            Ref: BedrockModelId
          NODE_OPTIONS: --enable-source-maps
          RETENTION_DAYS:
            Ref: RetentionDays
