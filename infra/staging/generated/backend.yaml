          ExpirationInDays: 1
          Id: ExpireUploads
          Prefix: uploads/
          Status: Enabled
      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
    Type: AWS::S3::Bucket
    UpdateReplacePolicy: Delete
Rules:
  ExistingCognitoParametersTogether:
    Assertions:
    - Assert:
        Fn::Or:
        - Fn::And:
          - Fn::Equals:
            - Ref: ExistingUserPoolId
            - ''
          - Fn::Equals:
            - Ref: ExistingUserPoolClientId
            - ''
        - Fn::And:
          - Fn::Not:
            - Fn::Equals:
              - Ref: ExistingUserPoolId
              - ''
          - Fn::Not:
            - Fn::Equals:
              - Ref: ExistingUserPoolClientId
              - ''
      AssertDescription: ExistingUserPoolId and ExistingUserPoolClientId must be supplied together or both omitted.
  StagingRequiresApprovedUsers:
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: StagingAllowedUserSubs
          - ''
      AssertDescription: Staging requires approved Cognito sub UUIDs; an empty list cannot allow public access.
    RuleCondition:
      Fn::Equals:
      - Ref: AppEnv
      - staging
  StagingRequiresExternalIdentity:
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: ExistingUserPoolId
          - ''
      AssertDescription: ExistingUserPoolId must identify the approved existing external identity.
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: ExistingUserPoolClientId
          - ''
      AssertDescription: ExistingUserPoolClientId must identify the approved existing external identity.
