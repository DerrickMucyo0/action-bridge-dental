AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ActionBridge Dental API, Phase 3 vertical slice: cases, estimates and scenarios.
  Cognito login (synthetic data only; self-registration is disabled by default). Code is pre-bundled by `npm run build:lambda`.

Parameters:
  AppEnv:
    Type: String
    AllowedValues: [dev, demo, staging]
    Default: dev
    Description: Stage name and APP_ENV. Deploy dev, demo and restricted staging as separate stacks.
  ExistingUserPoolId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z]{2}(-[a-z0-9]+)+-[0-9]_[A-Za-z0-9]+$'
    Description: Optional existing Cognito pool in this stack region. Supply together with ExistingUserPoolClientId; this stack never manages the supplied resources.
  ExistingUserPoolClientId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9]{20,40}$'
    Description: Optional existing public Cognito client belonging to ExistingUserPoolId. Verify client membership and absence of a secret before deployment.
  StagingAllowedUserSubs:
    Type: String
    Default: ''
    NoEcho: true
    MaxLength: 369
    AllowedPattern: '^$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(,[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}){0,9}$'
    Description: Required for staging; 1-10 approved Cognito sub UUIDs, comma-separated without spaces. Never email addresses or tokens.
  StagingJobDailyLimit:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
    Description: Staging-only per-user UTC-day admission limit; attempted work consumes quota even if processing fails.
  StagingUploadDailyLimit:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
    Description: Staging-only per-user UTC-day admission limit; attempted work consumes quota even if processing fails.
  StagingSpeechDailyLimit:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 100
    Description: Staging-only per-user UTC-day admission limit; attempted work consumes quota even if processing fails.
  StagingGlobalJobDailyLimit:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 1000
    Description: Staging-only global UTC-day admission limit; attempted work consumes quota even if processing fails.
  StagingGlobalUploadDailyLimit:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 1000
    Description: Staging-only global UTC-day admission limit; attempted work consumes quota even if processing fails.
  StagingGlobalSpeechDailyLimit:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 1000
    Description: Staging-only global UTC-day admission limit; attempted work consumes quota even if processing fails.
  RetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 90
    Description: Demo case records expire via DynamoDB TTL (eventual deletion, not immediate).
  BedrockModelId:
    Type: String
    # Amazon Nova 2 Lite: first-party model, no AWS Marketplace subscription or card check (D-18).
    # Claude Haiku 4.5 (us.anthropic.claude-haiku-4-5-20251001-v1:0) works once the account has a valid payment method.
    Default: us.amazon.nova-2-lite-v1:0
    Description: Bedrock inference profile the agent worker calls.
  BedrockFoundationModel:
    Type: String
    Default: amazon.nova-2-lite-v1:0
    Description: Foundation model behind the inference profile (IAM scope).
  EnableSelfRegistration:
    Type: String
    AllowedValues: ['false', 'true']
    Default: 'false'
    Description: Explicitly opt a reviewed synthetic-data stage into email-confirmed public registration. Does not enable a production release.
  AuthCallbackUrls:
    Type: CommaDelimitedList
    Default: actionbridgedental://auth/callback
    Description: Mobile app redirect URIs for Cognito managed login (authorization code + PKCE).
  WebOrigins:
    Type: CommaDelimitedList
    Default: https://action-bridge-dental-web.vercel.app,http://localhost:5173,http://127.0.0.1:5173
    Description: Browser origins allowed to call the API and upload to the private bucket (CORS). Origins only, no paths.
  StagingWebOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:5173,http://127.0.0.1:5173
    AllowedPattern: '^https://[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?$|^http://(localhost|127[.]0[.]0[.]1):5173$'
    ConstraintDescription: Staging origins must be exact HTTPS origins or localhost/127.0.0.1 HTTP origins on port 5173, without paths or wildcards.
    Description: Staging-only browser origins; local development by default. Add only explicitly approved HTTPS Vercel Preview origins.

Rules:
  ExistingCognitoParametersTogether:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref ExistingUserPoolId, '']
            - !Equals [!Ref ExistingUserPoolClientId, '']
          - !And
            - !Not [!Equals [!Ref ExistingUserPoolId, '']]
            - !Not [!Equals [!Ref ExistingUserPoolClientId, '']]
        AssertDescription: ExistingUserPoolId and ExistingUserPoolClientId must be supplied together or both omitted.
  StagingRequiresApprovedUsers:
    RuleCondition: !Equals [!Ref AppEnv, staging]
    Assertions:
      - Assert: !Not [!Equals [!Ref StagingAllowedUserSubs, '']]
        AssertDescription: Staging requires approved Cognito sub UUIDs; an empty list cannot allow public access.

Conditions:
  IsStaging: !Equals [!Ref AppEnv, staging]
  UseManagedCognito: !Equals [!Ref ExistingUserPoolId, '']
  PublicRegistrationEnabled: !Equals [!Ref EnableSelfRegistration, 'true']

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Handler: index.handler
    MemorySize: 512
    Timeout: 10
    Environment:
      Variables:
        APP_ENV: !Ref AppEnv
        # Owner = `sub` claim of a Cognito token already checked by the HttpApi JWT authorizer (D-10).
        AUTH_MODE: jwt
        NODE_OPTIONS: --enable-source-maps
        STAGING_ALLOWED_USER_SUBS: !If [IsStaging, !Ref StagingAllowedUserSubs, !Ref AWS::NoValue]
        STAGING_JOB_DAILY_LIMIT: !If [IsStaging, !Ref StagingJobDailyLimit, !Ref AWS::NoValue]
        STAGING_UPLOAD_DAILY_LIMIT: !If [IsStaging, !Ref StagingUploadDailyLimit, !Ref AWS::NoValue]
        STAGING_SPEECH_DAILY_LIMIT: !If [IsStaging, !Ref StagingSpeechDailyLimit, !Ref AWS::NoValue]
        STAGING_GLOBAL_JOB_DAILY_LIMIT: !If [IsStaging, !Ref StagingGlobalJobDailyLimit, !Ref AWS::NoValue]
        STAGING_GLOBAL_UPLOAD_DAILY_LIMIT: !If [IsStaging, !Ref StagingGlobalUploadDailyLimit, !Ref AWS::NoValue]
        STAGING_GLOBAL_SPEECH_DAILY_LIMIT: !If [IsStaging, !Ref StagingGlobalSpeechDailyLimit, !Ref AWS::NoValue]

Resources:
  CasesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  UserPool:
    Type: AWS::Cognito::UserPool
    Condition: UseManagedCognito
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      UserPoolName: !Sub actionbridge-dental-${AppEnv}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      # Preserve admin-only accounts by default. Opt-in requires a reviewed stage deployment.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: !If [PublicRegistrationEnabled, false, true]
      VerificationMessageTemplate: !If
        - PublicRegistrationEnabled
        - DefaultEmailOption: CONFIRM_WITH_CODE
        - !Ref AWS::NoValue
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: UseManagedCognito
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub actionbridge-dental-mobile-${AppEnv}
      # Shared public mobile/web client: never place a client secret in either app.
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: !Ref AuthCallbackUrls
      LogoutURLs: !Ref AuthCallbackUrls
      # USER_PASSWORD_AUTH lets the smoke test and a native sign-in form get tokens without a browser redirect.
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: UseManagedCognito
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub actionbridge-dental-${AppEnv}-${AWS::AccountId}

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref AppEnv
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !If
                - UseManagedCognito
                - !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
                - !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${ExistingUserPoolId}
              audience:
                - !If [UseManagedCognito, !Ref UserPoolClient, !Ref ExistingUserPoolClientId]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      # The web app calls the API from the browser. API Gateway answers preflight requests itself,
      # before the JWT authorizer; only the listed origins, methods and headers are allowed.
      # SAM treats a nested intrinsic AllowOrigins as an entire CORS object. Select the full
      # configuration instead so the transformed OpenAPI retains methods, headers and max age.
      CorsConfiguration: !If
        - IsStaging
        - AllowOrigins: !Ref StagingWebOrigins
          AllowMethods: [GET, POST, PATCH, OPTIONS]
          AllowHeaders: [authorization, content-type, idempotency-key]
          ExposeHeaders: [x-request-id]
          MaxAge: 600
        - AllowOrigins: !Ref WebOrigins
          AllowMethods: [GET, POST, PATCH, OPTIONS]
          AllowHeaders: [authorization, content-type, idempotency-key]
          ExposeHeaders: [x-request-id]
          MaxAge: 600

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/.build/health
      Description: GET /health — status and versions only
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /health
            Auth:
              Authorizer: NONE

  CasesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/.build/cases
      Description: Owner-scoped cases, strategy saves and the case ledger (transactional writes)
      Environment:
        Variables:
          TABLE_NAME: !Ref CasesTable
          RETENTION_DAYS: !Ref RetentionDays
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:ConditionCheckItem
                - dynamodb:Query
              Resource: !GetAtt CasesTable.Arn
      Events:
        CreateCase:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/cases
        GetCase:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/cases/{caseId}
        PatchCase:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PATCH
            Path: /v1/cases/{caseId}
        SaveStrategy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/cases/{caseId}/strategies
        GetLedger:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/cases/{caseId}/ledger
        ListStrategies:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/cases/{caseId}/strategies
        SavePlanComparison:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/cases/{caseId}/plan-comparisons
        ListPlanComparisons:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/cases/{caseId}/plan-comparisons
        GetPlanComparison:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/cases/{caseId}/plan-comparisons/{comparisonId}

  CalculationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/.build/calculations
      Description: Estimates and schedule comparison from the pure benefits engine (read-only)
      Environment:
        Variables:
          TABLE_NAME: !Ref CasesTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt CasesTable.Arn
      Events:
        Estimate:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/cases/{caseId}/estimates
        Scenarios:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/cases/{caseId}/scenarios
        CoverageComparison:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/cases/{caseId}/coverage-comparison
        PlanComparison:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/cases/{caseId}/plan-comparison

  UploadBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Voice notes and documents are deleted by the worker after reading; this is the backstop.
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      # Browsers send the presigned POST straight to S3. The presigned policy still enforces size,
      # content type and key; CORS only lets the allowed web origins make that request.
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !If [IsStaging, !Ref StagingWebOrigins, !Ref WebOrigins]
            AllowedMethods: [POST]
            AllowedHeaders: ['*']
            MaxAge: 600

  JobDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true

  JobQueue:
    Type: AWS::SQS::Queue
    Properties:
      # Longer than the worker timeout, so an in-flight job is not redelivered while it runs.
      VisibilityTimeout: 360
      MessageRetentionPeriod: 3600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobDeadLetterQueue.Arn
        maxReceiveCount: 2

  JobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/.build/jobs
      Description: Agent jobs API — create, view, answer, retry, cancel (enqueues; never calls the model)
      Environment:
        Variables:
          TABLE_NAME: !Ref CasesTable
          RETENTION_DAYS: !Ref RetentionDays
          JOB_QUEUE_URL: !Ref JobQueue
          UPLOAD_BUCKET: !Ref UploadBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt CasesTable.Arn
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt JobQueue.Arn
            # Signs presigned POST upload slots (S3 enforces size and type).
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub ${UploadBucket.Arn}/uploads/*
            # Read-aloud (accessibility). Polly has no resource-level scoping for this action.
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: '*'
        - !If
          - IsStaging
          - Statement:
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt CasesTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ['STAGING_QUOTA#*']
          - !Ref AWS::NoValue
      Events:
        Speech:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/speech
        CreateUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/cases/{caseId}/uploads
        CreateJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/cases/{caseId}/jobs
        GetJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/jobs/{jobId}
        AnswerJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/jobs/{jobId}/answers
        RetryJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/jobs/{jobId}/retry
        CancelJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/jobs/{jobId}/cancel

  JobWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/.build/job-worker
      Description: Agent worker — bounded Bedrock tool loop over the deterministic engine (SQS, batch 1)
      Timeout: 240
      MemorySize: 1024
      Environment:
        Variables:
          TABLE_NAME: !Ref CasesTable
          RETENTION_DAYS: !Ref RetentionDays
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          UPLOAD_BUCKET: !Ref UploadBucket
          # Underscore separates the stack name (which cannot contain it) from the job ID.
          TRANSCRIPTION_JOB_PREFIX: !If [IsStaging, !Sub 'actionbridge-${AWS::StackName}_', !Ref AWS::NoValue]
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt CasesTable.Arn
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}
                - !Sub arn:aws:bedrock:*::foundation-model/${BedrockFoundationModel}
            # Nova needs no Marketplace permissions. Optional third-party model access must be
            # provisioned by an operator, never subscribed by this runtime execution role.
            # Reads (Transcribe/Textract use these permissions too) and deletes uploads after reading.
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub ${UploadBucket.Arn}/uploads/*
            # Get/Delete support job ARN scoping. Staging uses its stack-specific job prefix.
            - Effect: Allow
              Action:
                - transcribe:GetTranscriptionJob
                - transcribe:DeleteTranscriptionJob
              Resource: !If
                - IsStaging
                - !Sub arn:${AWS::Partition}:transcribe:${AWS::Region}:${AWS::AccountId}:transcription-job/actionbridge-${AWS::StackName}_*
                - !Sub arn:${AWS::Partition}:transcribe:${AWS::Region}:${AWS::AccountId}:transcription-job/actionbridge-*
            # StartTranscriptionJob and these Textract APIs do not support resource-level scoping.
            - Effect: Allow
              Action:
                - transcribe:StartTranscriptionJob
                - textract:DetectDocumentText
                # Multi-page PDFs: asynchronous detection processes the entire document even if
                # the application reads only the first pages. Admission quotas bound job counts.
                - textract:StartDocumentTextDetection
                - textract:GetDocumentTextDetection
              Resource: '*'
      Events:
        Jobs:
          Type: SQS
          Properties:
            Queue: !GetAtt JobQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
            # Caps concurrent model calls (cost and quota) without reserving account concurrency.
            ScalingConfig:
              MaximumConcurrency: 2

  JobsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${JobsFunction}
      RetentionInDays: 7

  JobWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${JobWorkerFunction}
      RetentionInDays: 7

  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${HealthFunction}
      RetentionInDays: 7

  CasesLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${CasesFunction}
      RetentionInDays: 7

  CalculationsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${CalculationsFunction}
      RetentionInDays: 7

Outputs:
  ApiBaseUrl:
    Description: Base URL including the stage. Set as EXPO_PUBLIC_API_BASE_URL and API_BASE_URL for the smoke test.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${AppEnv}
  CasesTableName:
    Description: DynamoDB table holding owner-scoped cases
    Value: !Ref CasesTable
  UserPoolId:
    Description: Cognito user pool (synthetic data only; admin-created accounts unless self-registration is explicitly enabled)
    Value: !If [UseManagedCognito, !Ref UserPool, !Ref ExistingUserPoolId]
  UserPoolClientId:
    Description: Public mobile client ID (not a secret). Set as EXPO_PUBLIC_COGNITO_CLIENT_ID.
    Value: !If [UseManagedCognito, !Ref UserPoolClient, !Ref ExistingUserPoolClientId]
  CognitoIssuer:
    Description: Token issuer checked by the API authorizer
    Value: !If
      - UseManagedCognito
      - !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
      - !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${ExistingUserPoolId}
  JobDeadLetterQueueUrl:
    Description: Agent jobs that failed twice in the worker land here for inspection
    Value: !Ref JobDeadLetterQueue
  ManagedLoginDomain:
    Condition: UseManagedCognito
    Description: Cognito managed login base URL for the mobile PKCE flow
    Value: !Sub https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
